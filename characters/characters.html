<body>
    <h1>まだだよん</h1>
    <h2>軸の説明</h2>
    <h3>関係(Kankei)</h3>
    <p>甘く親密な雰囲気を楽しむか(Sweet)、ドライな関係を楽しむか(Dry)</p>

    <h3>体験の進め方(Style of play)</h3>
    <p>変化をつけてテンポよく楽しみたいか(Progression)、一つの体験をじっくり楽しみたいか(Immersion)</p>

    <h3>楽しさの源泉(Gratification)</h3>
    <p>自分の感覚的な満足を中心に楽しむか(Sensation)、相手の反応や満足度も楽しさの一部として捉えるか(Reaction)</p>

    <h3>主導権(Reins)</h3>
    <p>自分が主導したいか(Dominance)、相手に委ねたいか(Submission)</p>
  </body>
